name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # The Windows code paths (file replace retry, Task Scheduler, hook paths)
    # have been written and unit-tested from Linux but never run on Windows, so
    # a failure there is information, not yet a blocker. Remove this line once
    # the Windows job has been green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: test (race detector on Linux)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: test
        if: runner.os != 'Linux'
        run: go test ./...

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build ${{ matrix.target }} with no cgo
        env:
          CGO_ENABLED: "0"
        run: |
          target="${{ matrix.target }}"
          GOOS="${target%/*}" GOARCH="${target#*/}" go build -trimpath -o /dev/null ./cmd/beacon
